name: jobverifai-inngest

services:
  inngest:
    image: inngest/inngest:v1.43.0
    restart: unless-stopped
    command: >
      inngest start
      --sqlite-dir /data
      -u ${INNGEST_APP_URL:?INNGEST_APP_URL is required (worker's public /api/inngest URL, e.g. https://jobverifai-worker.ronmrcdo.dev/api/inngest)}
    environment:
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is required (openssl rand -hex 32)}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is required (openssl rand -hex 32)}
    volumes:
      - inngest-data:/data
    networks: [coolify]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      # NOTE: the routing hostname is INNGEST_DOMAIN, NOT INNGEST_HOST. Coolify
      # injects every env var from its UI into the container, and `inngest start`
      # reads INNGEST_HOST as its own bind hostname (--host). Reusing it here
      # would make Inngest try to listen on "https://…:8288" → "too many colons".
      - "traefik.enable=true"
      - "traefik.http.services.jhv-inngest.loadbalancer.server.port=8288"
      - "traefik.http.routers.jhv-inngest-events.rule=Host(`${INNGEST_DOMAIN:-jobverifai-inngest.ronmrcdo.dev}`) && PathPrefix(`/e/`)"
      - "traefik.http.routers.jhv-inngest-events.priority=100"
      - "traefik.http.routers.jhv-inngest-events.service=jhv-inngest"
      - "traefik.http.routers.jhv-inngest.rule=Host(`${INNGEST_DOMAIN:-jobverifai-inngest.ronmrcdo.dev}`)"
      - "traefik.http.routers.jhv-inngest.priority=1"
      - "traefik.http.routers.jhv-inngest.service=jhv-inngest"
      - "traefik.http.routers.jhv-inngest.middlewares=jhv-inngest-auth"
      - "traefik.http.middlewares.jhv-inngest-auth.basicauth.users=${INNGEST_BASICAUTH_USERS:?INNGEST_BASICAUTH_USERS is required (docker run --rm httpd:alpine htpasswd -nbB admin '<password>')}"

networks:
  coolify:
    external: true

volumes:
  inngest-data:

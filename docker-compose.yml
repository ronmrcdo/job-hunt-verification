name: job-hunt-verification

# Local V1 dev stack: self-hosted Inngest + Python worker/API + Next.js web.
# Postgres/Auth/Storage come from the Supabase CLI (`supabase start`), NOT this
# file; containers reach it via the host gateway. See scripts/RUNBOOK.md.
# Flow: web → Supabase (pg_net trigger) → inngest → api-worker /api/inngest → graph.

x-api-env: &api-env
  DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # For the local llama service: set OPENAI_BASE_URL=http://llama:8080/v1 (+ the model ids).
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  CHEAP_MODEL: ${CHEAP_MODEL:-gpt-5.6-luna}
  STRONG_MODEL: ${STRONG_MODEL:-gpt-5.6-luna}
  # `-` not `:-`: an explicit empty value passes through (omit the param); only UNSET falls back.
  CHEAP_REASONING_EFFORT: ${CHEAP_REASONING_EFFORT-low}
  STRONG_REASONING_EFFORT: ${STRONG_REASONING_EFFORT-high}
  STRUCTURED_OUTPUT_METHOD: ${STRUCTURED_OUTPUT_METHOD:-json_schema}
  STRUCTURED_OUTPUT_STRICT: ${STRUCTURED_OUTPUT_STRICT:-true}
  COST_PRICES_JSON: ${COST_PRICES_JSON:-}

services:
  # Single-binary Inngest dev server. --no-discovery disables cross-container port scanning.
  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://api-worker:8000/api/inngest --no-discovery
    ports:
      - "8288:8288" # dashboard + event ingestion (POST /e/<key>) + sync API
    depends_on:
      - api-worker

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # --reload + src bind mount = live reload on host edits; the image's /app/.venv is left intact.
    command: >
      uvicorn app.worker.app:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src
    volumes:
      - ./apps/api/src:/app/src
    environment:
      <<: *api-env
      INNGEST_BASE_URL: http://inngest:8288
      # DEV_SERVER mode (no keys/signature verification) to match `inngest dev`. prod leaves this unset for CLOUD mode.
      INNGEST_DEV: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000" # /api/inngest, /healthz

  web:
    build:
      context: ./apps/web
      target: dev
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    # Linux: share the host network so browser + server-side Supabase client resolve 127.0.0.1:54321.
    # Mac/Windows: drop network_mode, add ports ["3000:3000"] + extra_hosts host.docker.internal,
    # and point the URL at host.docker.internal (the browser must resolve it too).
    network_mode: host
    command: pnpm dev
    # Anonymous volumes shadow the bind mount so the Linux-built node_modules/.next survive.
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NODE_ENV: development
    depends_on:
      - api-http

  # SMTP sink for local dev. To route Supabase Auth mail here, set config.toml
  # [auth.email.smtp] to host.docker.internal:1025.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP intake
      - "8025:8025" # web UI (http://localhost:8025)

  # Local OpenAI-compatible LLM. Opt-in behind the `llm` profile (a plain `up` skips it):
  #   OPENAI_BASE_URL=http://llama:8080/v1 CHEAP_MODEL=<id> STRONG_MODEL=<id> docker compose --profile llm up
  # GPU: swap image for `:server-cuda` + add a deploy.resources GPU reservation.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    # --parallel gives the research node multiple decode slots; -c is TOTAL context split across them.
    command: >
      -hf ${LLAMA_HF_REPO:-bartowski/Qwen2.5-7B-Instruct-GGUF:Q4_K_M}
      --host 0.0.0.0 --port 8080
      -c ${LLAMA_CTX:-32768}
      --parallel ${LLAMA_PARALLEL:-4}
      --jinja
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llama-models:/models
    ports:
      - "8081:8080" # host access (8080 is api-http); in-network is :8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s # first boot downloads the model before /health goes green

volumes:
  llama-models:
